name: "Blueprint Studio"
description: "Powerful YAML editor, Blueprint creator, Git workspace, and AI assistant for Home Assistant."
version: "3.0.4"
slug: "blueprint-studio"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: "mdi:file-document-edit"
panel_title: "Blueprint Studio"
panel_admin: true
homeassistant_api: true
map:
  - homeassistant_config:rw
  - share:rw
  - ssl:ro
options:
  default_branch: "main"
schema:
  default_branch: "str?"
